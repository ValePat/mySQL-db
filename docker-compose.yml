version: "3.9"

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: auth-service
    env_file:
      - srv/.env   # Usa il tuo file .env dentro srv
    ports:
      - "3000:3000"
    networks:
      - app-network

  jobs-service:
    build:
      context: .
      dockerfile: Dockerfile.jobs
    container_name: jobs-service
    env_file:
      - srv/.env
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - jobs-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
